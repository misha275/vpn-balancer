<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Панель VPN</title>
<style>
:root{color-scheme:dark;--bg:#000;--side:#060607;--card:#0c0c0e;--card2:#131316;--text:#e9e9ec;--muted:#8c8c95;--line:#242429;--line2:#34343b;
--accent:#7aa7ff;--accent2:#1c3470;--adm:#e8a3a3;--admbg:rgba(232,163,163,.07);--admln:rgba(232,163,163,.4);
--ok:#5fd38a;--warn:#e6b94d;--bad:#ff6b6b;--chip:#17171b;--c1:#7aa7ff;--c2:#e6b94d;--c3:#5fd38a}
*{box-sizing:border-box;border-radius:0!important}
.dotc{border-radius:50%!important}
html,body{background:#000}
body{margin:0;color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
#app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
#side{background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
#side .brand{padding:16px 16px 12px;font-weight:700;letter-spacing:.04em;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
#side .brand small{color:var(--muted);font-weight:400;letter-spacing:0}
#burger{display:none}
#nav{padding:8px 0;flex:1}
.ng{margin-bottom:10px}
.ng .lbl{padding:8px 16px 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ng.adm .lbl{color:var(--adm)}
#nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;color:#b9b9c1;padding:8px 16px;font:inherit;cursor:pointer}
#nav button:hover{background:var(--card2);color:var(--text)}
#nav button.on{background:var(--card2);border-left-color:var(--accent);color:#fff;font-weight:600}
#nav .ng.adm button{color:#c9a3a3}
.ng.adm button:hover{color:var(--adm)}
.ng.adm button.on,#nav .ng.adm button.on{border-left-color:var(--adm);color:var(--adm);background:var(--admbg)}
#side .foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
main{padding:18px 24px 60px;min-width:0}
.pagehead{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.pagehead h1{font-size:19px;margin:0;font-weight:650}
.pagehead .sub1{color:var(--muted);font-size:13px}
.admzone .pagehead h1{color:var(--adm)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);padding:14px 16px;margin-bottom:14px}
.grid .card{margin:0}
.admzone .card,.card.adm{border-left:2px solid var(--admln)}
.admzone h2,.card.adm h2{color:var(--adm)}
.k{color:var(--muted);font-size:12px}.v{font-size:20px;font-weight:650;margin-top:2px;word-break:break-word}
h2{font-size:14px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;font-weight:650}
h3{font-size:13px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td,table tr:hover td{background:rgba(255,255,255,.015)}
.tw{overflow-x:auto}
button.b,input,select,textarea{font:inherit;color:var(--text)}
button.b{background:var(--accent);color:#000;border:1px solid var(--accent);padding:6px 12px;cursor:pointer;font-weight:600}
button.b:hover{filter:brightness(1.1)}
button.b.s{background:transparent;color:var(--text);border:1px solid var(--line2);font-weight:500}
button.b.s:hover{border-color:var(--accent);color:#fff}
button.b.d{background:transparent;color:var(--bad);border:1px solid #4a2326;font-weight:500}
button.b.d:hover{background:#2a1214}
button.b:disabled{opacity:.4;cursor:default}
.admzone button.b:not(.s):not(.d){background:var(--adm);border-color:var(--adm)}
.admzone button.b.s:hover{border-color:var(--adm)}
input,select,textarea{background:#050506;border:1px solid var(--line2);padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent)}
.admzone input:focus,.admzone select:focus,.admzone textarea:focus{border-color:var(--adm)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--accent)}
select{padding-right:6px}
textarea{min-height:90px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}
.row .grow{flex:1 1 220px}
.pill{display:inline-block;padding:1px 8px;font-size:12px;background:var(--chip);border:1px solid var(--line)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.muted{color:var(--muted)}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--chip);border:1px solid var(--line2);padding:2px 4px 2px 10px;margin:0 6px 6px 0}
.chip.bad{color:var(--bad)}
.chip.add{border-style:dashed;cursor:pointer;color:var(--muted);padding-right:10px}.chip.add:hover{color:var(--text);border-color:var(--accent)}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1}
.chip button:hover{color:var(--bad)}
.rule{border:1px solid var(--line);padding:10px;margin-bottom:10px}
.hint{color:var(--muted);font-size:12.5px;margin:4px 0 10px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
#toast{position:fixed;right:16px;bottom:16px;max-width:420px;background:#fff;color:#000;padding:10px 14px;display:none;z-index:99;border-left:4px solid var(--accent)}
#login{max-width:420px;margin:12vh auto}
.hidden{display:none!important}
.qrov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.qrbox{background:var(--card);border:1px solid var(--line2);padding:18px;max-width:380px;width:100%;text-align:center}
.qrbox img{width:260px;height:260px;image-rendering:pixelated;background:#fff;padding:8px}
.qrbox .mono{max-height:84px;overflow:auto;text-align:left;margin:10px 0;color:var(--muted)}
.mchip{display:inline-block;background:var(--chip);border:1px solid var(--line2);padding:0 6px;margin-left:6px;font-size:11px;color:var(--accent)}
.tag{display:inline-block;padding:0 6px;margin-left:6px;font-size:11px;border:1px solid var(--line2);color:var(--muted);vertical-align:1px}
.tag.adm{color:var(--adm);border-color:var(--admln);background:var(--admbg)}
.tag.usr{color:var(--accent);border-color:var(--accent2)}
.lnk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:3px 0}.lnk .t{min-width:230px}
.chartw{position:relative}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--muted);font-size:10px}
svg.chart .gl{stroke:var(--line);stroke-width:1}
.tip{position:absolute;top:0;pointer-events:none;background:#fff;color:#000;padding:5px 8px;font-size:12px;white-space:nowrap;display:none;z-index:3}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:4px}
.checks{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0}.checks label{display:flex;gap:6px;align-items:center;font-size:13px}.bars{width:100%;height:auto;display:block}.bars text{fill:var(--muted);font-size:9px}.bars .gl{stroke:var(--line);stroke-width:1}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px}
@media (max-width:480px){.cgrid{grid-template-columns:1fr}}
.dotc{display:inline-block;width:9px;height:9px;margin-right:6px;background:var(--muted)}
.dotc.on{background:var(--ok)}.dotc.act{background:var(--accent);box-shadow:0 0 0 3px rgba(122,167,255,.3)}
#con{background:#000;border:1px solid var(--line);color:#d6dbe1;padding:10px;height:62vh;overflow:auto;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
#con div.e{color:#ff8b8b}#con div.w{color:#f3c969}#con div.d{color:#8b95a1}
/* subnavigation of a tab */
.sub{display:flex;gap:0;border-bottom:1px solid var(--line);margin:0 0 14px;flex-wrap:wrap}
.sub button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 14px;font:inherit;cursor:pointer;margin-bottom:-1px}
.sub button:hover{color:var(--text)}
.sub button.on{color:#fff;border-bottom-color:var(--accent);font-weight:600}
.admzone .sub button.on{border-bottom-color:var(--adm);color:var(--adm)}
/* list and a card of one item side by side */
.split{display:grid;grid-template-columns:minmax(340px,480px) minmax(0,1fr);gap:14px;align-items:start}
.split .list{border:1px solid var(--line);background:var(--card)}
.split .list .tools{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;position:sticky;top:0;background:var(--card);z-index:2}
.listbody{max-height:calc(100vh - 230px);overflow:auto}
.urow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 12px 9px 10px;border-bottom:1px solid var(--line);border-left:3px solid transparent;cursor:pointer}
.urow:hover{background:var(--card2)}
.urow.ch-admin{border-left-color:var(--admln)}
.urow.ch-users{border-left-color:var(--accent2)}
.urow.sel{background:#16161a;box-shadow:inset 0 0 0 1px var(--line2)}
.urow .l2{grid-column:1/-1;display:flex;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.detail{border:1px solid var(--line);background:var(--card);position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.detail .dh{padding:14px 16px 0;position:sticky;top:0;background:var(--card);z-index:2;border-bottom:1px solid var(--line)}
.detail .dh h2{font-size:17px;text-transform:none;letter-spacing:0;margin:0;color:var(--text)}
.detail .db{padding:14px 16px}
.detail .sub{margin:10px -16px 0;padding:0 16px;border-bottom:0}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line2)}
.back{display:none}
.fld{margin:8px 0}.fld>.k{margin-bottom:3px}
.act{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.box{border:1px solid var(--line);padding:10px 12px;margin:10px 0;background:#08080a}
.box.adm{border-color:var(--admln);background:var(--admbg)}
.mem{display:flex;flex-wrap:wrap;gap:0;margin:6px 0}
.sec{display:flex;align-items:baseline;gap:10px;margin:18px 0 6px}
.sec h3{margin:0}
details>summary{cursor:pointer;color:var(--muted)}
details[open]>summary{color:var(--text);margin-bottom:6px}
/* terminal */
.termwrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
#term{background:#000;border:1px solid var(--line2);height:58vh;overflow:auto;padding:10px 12px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
#term .cmd{color:var(--adm)}#term .err{color:var(--bad)}#term .info{color:var(--muted)}
.termin{display:flex;border:1px solid var(--line2);border-top:0;background:#000}
.termin span{padding:8px 0 8px 12px;color:var(--adm);font:13px ui-monospace,Menlo,Consolas,monospace}
.termin input{border:0;background:#000;font:13px ui-monospace,Menlo,Consolas,monospace}
.ref{max-height:calc(100vh - 150px);overflow:auto}
.ref .c{padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ref .c:hover{background:var(--card2)}
.ref .c code{color:var(--adm);font-size:12.5px;word-break:break-word}
.ref .c div{color:var(--muted);font-size:12px}
.sgroup{margin:0 0 14px}
.srow{display:grid;grid-template-columns:minmax(180px,260px) minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:start}
.srow .kn{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all}
.srow.ov .kn::after{content:" · изменено";color:var(--warn);font-family:system-ui;font-size:11px}
:root{--c1:#7aa7ff;--c2:#e6b94d;--c3:#5fd38a}
@media (max-width:1180px){
  .split{display:block}
  .split.hasdet .list{display:none}
  .split:not(.hasdet) .detail{display:none}
  .detail{position:static;max-height:none}
  .back{display:inline-block}
  .listbody{max-height:none}
  .termwrap{grid-template-columns:1fr}
}
@media (max-width:900px){
  #app{display:block}
  #side{position:sticky;top:0;height:auto;z-index:30;flex-direction:row;flex-wrap:wrap;align-items:center;overflow:visible}
  #side .brand{border:0;flex:1}
  #burger{display:inline-block;margin:8px 12px}
  #nav{display:none;flex-basis:100%;max-height:70vh;overflow:auto;border-top:1px solid var(--line)}
  #side.open #nav{display:block}
  #side .foot{display:none}
  #side.open .foot{display:flex;flex-basis:100%}
  main{padding:14px 12px 50px}
  .srow{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="login" class="card hidden">
  <h2>Вход в панель</h2>
  <p class="hint">Токен показывает команда <span class="mono">balancer token</span> (внутри контейнера: <span class="mono">docker compose exec balancer balancer -c /etc/balancer/config.yaml token</span>).</p>
  <div class="row"><input id="tok" type="password" class="grow" placeholder="токен" autocomplete="off"><button class="b" id="tokgo">Войти</button></div>
  <p id="tokerr" class="bad"></p>
</div>

<div id="app" class="hidden">
<aside id="side">
  <div class="brand"><span>▌VPN</span><small>панель</small></div>
  <button class="b s" id="burger">☰ Меню</button>
  <nav id="nav"></nav>
  <div class="foot"><span id="state" class="pill">…</span><span style="flex:1"></span><button class="b s" id="logout">Выйти</button></div>
</aside>
<main id="main"></main>
</div>
<div id="toast"></div>

<script>
"use strict";
const $ = (s, r=document) => r.querySelector(s);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (k==="class") e.className=v; else if (k==="onclick") e.onclick=v; else if (k==="onchange") e.onchange=v; else if (k==="oninput") e.oninput=v; else if (k==="onkeydown") e.onkeydown=v;
    else if (v===true) e.setAttribute(k,""); else if (v!==false && v!=null) e.setAttribute(k,v);
  }
  for (const c of kids.flat()){ if (c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
let TOKEN = sessionStorage.getItem("tok")||"";
let TAB = "overview", SUB = {}, DATA = null, SET = null, STAT = null, HIST = null, RANGE = "1h";
let USERS = [], ACCS = [], PAYS = [], PLANS = [], PROMOS = [], CAT = null, NET = null, NETTR = null, USEL = null;
const CON = {src:"controller", user:"", users:null, after:0, epoch:0, lines:[], filter:"", follow:true};
let nodeFilter = "", nodeState = "all", nodePool = "all", sortKey = "score", sortDir = -1;

function toast(msg, bad){ const t=$("#toast"); t.textContent=msg; t.style.background=bad?"#ff6b6b":"#fff"; t.style.borderLeftColor=bad?"#7a0000":"var(--accent)"; t.style.display="block"; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display="none",4500); }
async function api(method, path, body){
  const r = await fetch(path,{method,headers:{"Authorization":"Bearer "+TOKEN,"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body)});
  let j=null; try{ j=await r.json(); }catch(e){}
  if (r.status===401){ logout(true); throw new Error("нужен токен"); }
  if (!r.ok) throw new Error((j&&j.error)||("HTTP "+r.status));
  return j;
}
function logout(showErr){ sessionStorage.removeItem("tok"); TOKEN=""; $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); $("#tokerr").textContent=showErr?"Токен не подошёл":""; }
$("#logout").onclick=()=>logout(false);
$("#burger").onclick=()=>$("#side").classList.toggle("open");
$("#tokgo").onclick=async()=>{ TOKEN=$("#tok").value.trim(); try{ await api("GET","/api/overview"); sessionStorage.setItem("tok",TOKEN); start(); }catch(e){ $("#tokerr").textContent=e.message; } };
$("#tok").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#tokgo").click(); });

// ---------------------------------------------------------------- navigation
// "Сервис": everything about people, servers they use and the site. "Администратор" (pale red): the balancer of the admins and the machine.
const NAV=[
  {g:"Сервис",items:[["overview","Обзор"],["users","Пользователи"],["channel","Канал пользователей"],["servers","Серверы"],["site","Сайт"]]},
  {g:"Администратор",adm:true,items:[["nodes","Узлы админов"],["clients","Клиенты"],["server","Сервер"],["wg","WireGuard"],["settings","Настройки"],["term","Терминал"],["console","Консоль"],["backup","Бэкапы"]]}];
const ADM=new Set(["nodes","clients","server","wg","settings","term","console","backup"]);
const PANEL_HIDE=["overview","server","clients","nodes","wg"]; // the role "panel" has no gateway
const TITLES={overview:"Обзор",users:"Пользователи",channel:"Канал пользователей",servers:"Серверы",site:"Сайт и форум",nodes:"Узлы канала админов",clients:"Клиенты на шлюзе",server:"Сервер",wg:"WireGuard",settings:"Настройки",term:"Терминал",console:"Консоль",backup:"Резервные копии"};
function renderNav(){
  const n=$("#nav");
  n.replaceChildren(...NAV.map(g=>h("div",{class:"ng"+(g.adm?" adm":"")},h("div",{class:"lbl"},g.g),
    g.items.filter(([id])=>!(DATA&&DATA.role==="panel"&&PANEL_HIDE.includes(id))).map(([id,t])=>h("button",{class:id===TAB?"on":"",onclick:()=>go(id)},t)))));
  $("#app").classList.toggle("admzone",ADM.has(TAB));
}
function hashOf(){ const p=[TAB]; const s=SUB[TAB]; if(s||(TAB==="users"&&USEL)) p.push(s||"people"); if(TAB==="users"&&USEL) p.push(encodeURIComponent(USEL)); return "#"+p.join("/"); }
function setHash(push){ const nh=hashOf(); if(location.hash===nh) return; try{ (push?history.pushState:history.replaceState).call(history,null,"",nh); }catch(e){} }
function readHash(){
  const p=location.hash.slice(1).split("/");
  if(p[0]&&NAV.some(g=>g.items.some(i=>i[0]===p[0]))){ TAB=p[0]; if(p[1]) SUB[TAB]=p[1]; if(TAB==="users"){ USEL=p[2]?decodeURIComponent(p[2]):null; } }
}
function go(tab,sub,arg){ TAB=tab; if(sub!==undefined) SUB[tab]=sub; if(tab==="users"&&arg!==undefined) USEL=arg; $("#side").classList.remove("open"); setHash(true); load(); window.scrollTo(0,0); }
function subGo(id){ SUB[TAB]=id; if(TAB==="users") USEL=null; setHash(true); render(); }
window.addEventListener("popstate",()=>{ readHash(); load(); });
function subNav(items,cur,on){ return h("div",{class:"sub"},items.map(([id,t])=>h("button",{class:id===cur?"on":"",onclick:()=>on(id)},t))); }
function pageHead(extra){ return h("div",{class:"pagehead"},h("h1",{},TITLES[TAB]||TAB),extra||null); }

async function load(){
  renderNav();
  try{
    const t=TAB;
    if (t==="overview"||t==="nodes"||t==="channel"){ DATA=await api("GET","/api/overview"); }
    if (t==="overview"){ [USERS,ACCS,PAYS]=await Promise.all([api("GET","/api/users"),api("GET","/api/accounts").catch(()=>[]),api("GET","/api/payments").catch(()=>[])]); }
    if (t==="overview"||t==="servers"){ try{ NETTR=await api("GET","/api/traffic/network"); }catch(e){ NETTR=null; } }
    if (t==="settings"||t==="channel"){ SET=await api("GET","/api/settings"); }
    if (t==="channel"){ USERS=await api("GET","/api/users"); }
    if (t==="users"){ await loadUsersData(); }
    if (t==="servers"){ [CAT,USERS,PLANS,NET]=await Promise.all([api("GET","/api/catalog"),api("GET","/api/users"),api("GET","/api/plans"),api("GET","/api/servers")]); }
    if (t==="site"){ [SITE,PAGES]=await Promise.all([api("GET","/api/site"),api("GET","/api/site/pages").then(r=>r.pages)]); if(SUB.site==="forum"){ FORUM=await api("GET","/api/forum/topics"); if(FTOPIC){ try{ FTOPIC=await api("GET","/api/forum/topics/"+FTOPIC.topic.id); }catch(e){ FTOPIC=null; } } } }
    if (t==="wg"){ WG=await api("GET","/api/wg"); }
    if (t==="backup"){ BK=await api("GET","/api/backups"); }
    if (t==="server"){ [STAT,HIST]=await Promise.all([api("GET","/api/stats"),api("GET","/api/stats/history?range="+RANGE)]); }
    if (t==="clients"){ STAT=await api("GET","/api/stats"); }
    if (!DATA) DATA=await api("GET","/api/overview");
  }catch(e){ if(TOKEN) toast(e.message,true); return; }
  if (DATA.role==="panel" && PANEL_HIDE.includes(TAB)){ TAB="users"; setHash(); return load(); }
  renderNav();
  const s=DATA.snapshot, st=$("#state");

// ---------------------------------------------------------------- terminal: the commands of the command line, with a reference at the side
let TERMHELP=null, TERMQ="", TERMHIST=[], TERMPOS=0, TERMOUT=[["info","Терминал панели: те же команды, что в командной строке сервера. Введите help — список, help КОМАНДА или help КЛЮЧ — описание. Стрелки ↑↓ — прошлые команды, клик по подсказке справа вставляет её."]];
VIEWS.term=function(){
  const out=h("div",{id:"term"});
  const drawOut=()=>{ out.replaceChildren(...TERMOUT.map(([c,t])=>h("div",{class:c},t))); out.scrollTop=out.scrollHeight; };
  const inp=h("input",{class:"grow",id:"termin",autocomplete:"off",spellcheck:"false",placeholder:"команда, например: users",
    onkeydown:e=>{
      if(e.key==="Enter"){ run(inp.value); inp.value=""; }
      else if(e.key==="ArrowUp"){ if(TERMPOS>0){ TERMPOS--; inp.value=TERMHIST[TERMPOS]||""; } e.preventDefault(); }
      else if(e.key==="ArrowDown"){ if(TERMPOS<TERMHIST.length){ TERMPOS++; inp.value=TERMHIST[TERMPOS]||""; } e.preventDefault(); }
    }});
  async function run(line){
    line=line.trim(); if(!line) return;
    TERMHIST.push(line); TERMHIST=TERMHIST.slice(-100); TERMPOS=TERMHIST.length;
    if(line==="clear"||line==="cls"){ TERMOUT=[]; return drawOut(); }
    TERMOUT.push(["cmd","› "+line]); drawOut();
    try{
      const r=await api("POST","/api/terminal",{line});
      if(r.out) TERMOUT.push(["",r.out.replace(/\n$/,"")]);
      if(r.error) TERMOUT.push(["err",r.error]);
    }catch(e){ TERMOUT.push(["err",e.message]); }
    TERMOUT=TERMOUT.slice(-400); drawOut();
  }
  const ref=h("div",{class:"card ref"},h("h2",{},"Справочник"),h("div",{class:"hint"},"загрузка…"));
  const drawRef=()=>{
    if(!TERMHELP) return;
    const q=TERMQ.toLowerCase();
    const body=[];
    TERMHELP.groups.forEach(g=>{
      const cs=g.cmds.filter(c=>!q||(c.cmd+" "+c.desc).toLowerCase().includes(q));
      if(!cs.length) return;
      body.push(h("h3",{},g.title));
      cs.forEach(c=>body.push(h("div",{class:"c",onclick:()=>{ inp.value=c.cmd.split(/\s{2,}/)[0].replace(/\s*[\[<(].*$/,"")+" "; inp.focus(); }},h("code",{},c.cmd),h("div",{},c.desc))));

function fmtBytes(n){ n=n||0; const u=["Б","КБ","МБ","ГБ","ТБ"]; let i=0; while(n>=1024&&i<u.length-1){ n/=1024; i++; } return (i===0?Math.round(n):n>=100?n.toFixed(0):n>=10?n.toFixed(1):n.toFixed(2))+" "+u[i]; }
function fmtBits(bps){ const b=(bps||0)*8; if(b<1000) return Math.round(b)+" бит/с"; if(b<1e6) return (b/1e3).toFixed(0)+" кбит/с"; if(b<1e9) return (b/1e6).toFixed(b<1e7?2:1)+" Мбит/с"; return (b/1e9).toFixed(2)+" Гбит/с"; }
function fmtDur(sec){ sec=Math.max(0,Math.round(sec)); const d=Math.floor(sec/86400),hh=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60); if(d) return d+" д "+hh+" ч"; if(hh) return hh+" ч "+m+" мин"; if(m) return m+" мин"; return sec+" с"; }
function fmtAgo(ts){ if(!ts) return "никогда"; const d=Date.now()/1000-ts; if(d<15) return "сейчас"; return fmtDur(d)+" назад"; }
function sv(tag,attrs,...kids){ const e=document.createElementNS("http://www.w3.org/2000/svg",tag); for(const [k,v] of Object.entries(attrs||{})) e.setAttribute(k,v); kids.forEach(c=>e.append(c)); return e; }
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); for(const m of [1,2,2.5,5,10]) if(v<=m*p) return m*p; return 10*p; }
function fmtT(t,long){ const d=new Date(t*1000); const hm=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}); return long? d.toLocaleDateString([],{day:"2-digit",month:"2-digit"})+" "+hm : hm; }

// series: [{key,label,color,fmt}], o: {max, fmt}
function chart(title, pts, series, o){
  o=o||{};
  const box=h("div",{class:"card"},h("h2",{},title));
  if(!pts||pts.length<2){ box.append(h("div",{class:"hint"},"Данные накапливаются: график появится через минуту-две.")); return box; }
  box.append(h("div",{class:"legend"},series.map(s=>h("span",{},h("i",{style:"background:"+s.color}),s.label))));
  const W=560,H=150,L=66,R=6,T=8,B=20, long=(pts[pts.length-1].t-pts[0].t)>26*3600;
  let max=o.max||niceMax(Math.max(...pts.map(p=>Math.max(...series.map(s=>p[s.key]||0)))));
  const t0=pts[0].t,t1=pts[pts.length-1].t||t0+1, X=t=>L+(W-L-R)*(t-t0)/Math.max(1,t1-t0), Y=v=>T+(H-T-B)*(1-Math.min(v,max)/max);
  const svg=sv("svg",{class:"chart",viewBox:"0 0 "+W+" "+H});
  for(let i=0;i<=2;i++){ const v=max*i/2,y=Y(v); svg.append(sv("line",{class:"gl",x1:L,x2:W-R,y1:y,y2:y})); const tx=sv("text",{x:L-5,y:y+3,"text-anchor":"end"}); tx.textContent=(o.fmt||(x=>Math.round(x)))(v); svg.append(tx); }
  for(let i=0;i<=3;i++){ const t=t0+(t1-t0)*i/3, tx=sv("text",{x:X(t),y:H-5,"text-anchor":i===0?"start":i===3?"end":"middle"}); tx.textContent=fmtT(t,long); svg.append(tx); }
  series.forEach(s=>{
    const d=pts.map((p,i)=>(i?"L":"M")+X(p.t).toFixed(1)+" "+Y(p[s.key]||0).toFixed(1)).join(" ");
    svg.append(sv("path",{d:d+" L"+X(t1)+" "+Y(0)+" L"+X(t0)+" "+Y(0)+"Z",fill:s.color,opacity:".10"}));
    svg.append(sv("path",{d,fill:"none",stroke:s.color,"stroke-width":"1.6","stroke-linejoin":"round"}));
  });
  const vl=sv("line",{x1:0,x2:0,y1:T,y2:H-B,stroke:"var(--muted)","stroke-width":"1",style:"display:none"}); svg.append(vl);
  const tip=h("div",{class:"tip"}), wrap=h("div",{class:"chartw"},svg,tip);
  svg.addEventListener("mousemove",e=>{ const r=svg.getBoundingClientRect(), x=(e.clientX-r.left)/r.width*W; let best=0,bd=1e18; pts.forEach((p,i)=>{ const dd=Math.abs(X(p.t)-x); if(dd<bd){bd=dd;best=i;} }); const p=pts[best];

    tip.replaceChildren(h("div",{},fmtT(p.t,true)),...series.map(s=>h("div",{},s.label+": "+(s.fmt||o.fmt||(v=>v.toFixed(1)))(p[s.key]||0))));
    tip.style.display="block"; const left=Math.min(Math.max(0,X(p.t)/W*r.width-60),r.width-130); tip.style.left=left+"px"; });
  svg.addEventListener("mouseleave",()=>{ vl.style.display="none"; tip.style.display="none"; });
  box.append(wrap); return box;
}

      chart("Нагрузка (load average, 1 мин)",P,[{key:"load1",label:"load",color:"var(--c1)",fmt:v=>v.toFixed(2)}],{fmt:v=>v.toFixed(1)})),
    h("div",{class:"hint"},"Процессор, память и диск показывают весь сервер. «Сеть клиентов» это байты, прошедшие через шлюз от пользователей и к ним (без трафика самих проверок узлов). История сохраняется в базе, 7 дней доступны в графике."));
}

function userBadge(u){ return h("span",{},h("span",{class:"dotc "+(u.active?"act":u.online?"on":"")}),u.active?"передаёт":u.online?"онлайн":"не в сети"); }
function vClients(){
  if(!STAT) return h("div",{class:"hint"},"загрузка…");
  const U=STAT.users, on=U.filter(u=>u.online).length, act=U.filter(u=>u.active).length;
  const sum=k=>U.reduce((a,u)=>a+(u[k]||0),0);
  const tr=(u,named)=>h("tr",{},
    h("td",{},userBadge(u)),
    h("td",{},h("div",{},named?u.name:(u.label||u.name),u.kind==="wg"?h("span",{class:"chip",style:"margin:0 0 0 6px;padding:1px 7px;font-size:11px"},"WireGuard"):null),u.enabled===false&&named?h("div",{class:"muted"},u.removed?"удалён":"отключён"):null),
    h("td",{},u.online||u.up_bps||u.down_bps?h("div",{},"↓ "+fmtBits(u.down_bps),h("br"),"↑ "+fmtBits(u.up_bps)):h("span",{class:"muted"},"—")),
    h("td",{},u.conns||"—"),
    h("td",{class:"mono"},u.ips&&u.ips.length?u.ips.join(", "):(u.last_ip||"—")),
    h("td",{},"↓ "+fmtBytes(u.h24_down),h("br"),"↑ "+fmtBytes(u.h24_up)),
    h("td",{},"↓ "+fmtBytes(u.d7_down),h("br"),"↑ "+fmtBytes(u.d7_up)),
    h("td",{},"↓ "+fmtBytes(u.d30_down),h("br"),"↑ "+fmtBytes(u.d30_up)),
    h("td",{},"↓ "+fmtBytes(u.all_down),h("br"),"↑ "+fmtBytes(u.all_up)),
    h("td",{},named?fmtAgo(u.last_seen):"—"),
    h("td",{},named?h("div",{},u.errors?h("span",{class:"warn",title:(u.err_msg||"")+"\n"+fmtAgo(u.last_err)},u.errors+" ош."):h("span",{class:"muted"},"нет"),
      " ",h("button",{class:"b s",onclick:()=>{ CON.src="user"; CON.user=u.name; CON.after=0; CON.epoch=0; CON.lines=[]; TAB="console"; load(); }},"Диагностика")):null));
  const head=()=>h("tr",{},["","Пользователь","Сейчас","Подключ.","Адреса","24 часа","7 дней","30 дней","Всего","Был в сети","Ошибки"].map(t=>h("th",{},t)));
  return h("div",{},
    STAT.gateway_error?h("div",{class:"card"},h("span",{class:"bad"},"Шлюз не отдаёт статистику: "+STAT.gateway_error)):null,
    h("div",{class:"grid"},
      card("Онлайн сейчас",on+" из "+U.filter(u=>u.enabled).length,on?"ok":""),
      card("Передают данные",act),
      card("Трафик за 24 часа","↓ "+fmtBytes(sum("h24_down"))+" ↑ "+fmtBytes(sum("h24_up"))),
      card("Трафик за 30 дней","↓ "+fmtBytes(sum("d30_down"))+" ↑ "+fmtBytes(sum("d30_up")))),
    h("div",{class:"card tw"},h("h2",{},"Пользователи"),
      U.length?h("table",{},head(),U.map(u=>tr(u,true))):h("div",{class:"hint"},"Пока нет данных. Появятся, когда кто-нибудь подключится.")),
    h("div",{class:"card tw"},h("h2",{},"Активные соединения"),
      STAT.sessions.length?h("table",{},h("tr",{},["Пользователь","Адрес клиента","Длится","Скачал ↓","Отправил ↑","Без данных"].map(t=>h("th",{},t))),
        STAT.sessions.slice(-200).reverse().map(se=>h("tr",{},h("td",{},se.user||h("span",{class:"muted"},"определяется…")),h("td",{class:"mono"},se.ip),h("td",{},fmtDur((Date.now()-new Date(se.since))/1000)),h("td",{},fmtBytes(se.down)),h("td",{},fmtBytes(se.up)),h("td",{},se.idle_sec>=5?fmtDur(se.idle_sec):"—")))):h("div",{class:"hint"},"Сейчас нет открытых соединений.")),
    STAT.other.length||STAT.invalid.length?h("div",{class:"card tw"},h("h2",{},"Не опознанные подключения"),
      h("div",{class:"hint"},"«Не прошли проверку Reality» это клиенты с неверными ключами, short id или отпечатком TLS, а также сканеры из интернета. Если здесь постоянно один и тот же адрес и это ваш телефон, проверьте в профиле Public Key, Short ID и Fingerprint (для свежих клиентов Xray ставьте ios)."),
      STAT.other.length?h("table",{},head(),STAT.other.map(u=>tr(u,false))):null,
      STAT.invalid.length?h("table",{style:"margin-top:10px"},h("tr",{},["Адрес","Попыток","Последняя"].map(t=>h("th",{},t))),
        STAT.invalid.slice(0,20).map(i=>h("tr",{},h("td",{class:"mono"},i.ip),h("td",{},i.count),h("td",{},fmtAgo(new Date(i.last).getTime()/1000))))):null):null,
    h("div",{class:"hint"},"Учитывается только объём данных. Какие сайты открывают пользователи, не сохраняется и не показывается."));
}

// ---------------------------------------------------------------- console
function vConsole(){
  const pre=h("div",{id:"con"});
  const src=h("select",{style:"width:auto",onchange:e=>{CON.src=e.target.value;usel.style.display=CON.src==="user"?"":"none";CON.after=0;CON.epoch=0;CON.lines=[];drawCon();pollCon();}},
    [["controller","Контроллер"],["gateway","Шлюз (sing-box)"],["user","Ошибки пользователя"]].map(([v,t])=>h("option",{value:v,selected:v===CON.src},t)));
  const usel=h("select",{style:"width:auto;"+(CON.src==="user"?"":"display:none"),onchange:e=>{CON.user=e.target.value;CON.after=0;CON.epoch=0;CON.lines=[];drawCon();pollCon();}});
  const fillUsers=()=>usel.replaceChildren(...(CON.users||[]).map(n=>h("option",{value:n,selected:n===CON.user},n)));
  if(CON.users) fillUsers(); else api("GET","/api/users").then(us=>{ CON.users=us.map(u=>u.name); if(!CON.user&&CON.users.length) CON.user=CON.users[0]; fillUsers(); if(CON.src==="user"){CON.after=0;CON.epoch=0;CON.lines=[];pollCon();} }).catch(()=>{});
  if(!CON.user&&CON.users&&CON.users.length) CON.user=CON.users[0];
  const flt=h("input",{class:"grow",placeholder:"фильтр по тексту",value:CON.filter,oninput:e=>{CON.filter=e.target.value;drawCon();}});
  const fol=h("input",{type:"checkbox",style:"width:auto",checked:CON.follow,onchange:e=>{CON.follow=e.target.checked;if(CON.follow) drawCon();}});
  setTimeout(()=>{drawCon();pollCon();},0);
  return h("div",{},
    h("div",{class:"row",style:"margin-bottom:10px"},src,usel,flt,h("label",{class:"row"},fol,"прокручивать"),
      h("button",{class:"b s",onclick:()=>{CON.lines=[];drawCon();}},"Очистить экран"),
      h("button",{class:"b s",onclick:()=>{ const b=new Blob([CON.lines.map(l=>new Date(l.t).toISOString()+" "+l.text).join("\n")],{type:"text/plain"}); const a=h("a",{href:URL.createObjectURL(b),download:"console-"+CON.src+".txt"}); a.click(); }},"Скачать")),
    pre,
    h("div",{class:"hint"},"Контроллер: проверки, подписки, переключения. Шлюз: предупреждения и ошибки sing-box, запуск и смена конфигураций. Ошибки пользователя: что не удалось открыть этому клиенту и какие адреса заблокировали правила (хранится последние 300 событий, с момента запуска шлюза); обычные соединения не записываются. Обновляется каждые 2 секунды, хранятся последние 3000 строк."));
}
function lineCls(t){ return /\b(ERROR|FATAL|PANIC|panic|failed|ошибк)/i.test(t)?"e":/\bWARN/.test(t)?"w":""; }
function drawCon(){
  const el=$("#con"); if(!el) return;
  const q=CON.filter.toLowerCase();
  const rows=CON.lines.filter(l=>!q||l.text.toLowerCase().includes(q)).slice(-1200);
  const stick=CON.follow||(el.scrollTop+el.clientHeight>=el.scrollHeight-30);
  el.replaceChildren(...rows.map(l=>h("div",{class:lineCls(l.text)},l.text)));
  if(stick) el.scrollTop=el.scrollHeight;
}
async function pollCon(){
  if(TAB!=="console"||pollCon.busy) return; pollCon.busy=true;
  try{
    if(CON.src==="user"&&!CON.user){ drawCon(); return; }
    const uq=CON.src==="user"?"&user="+encodeURIComponent(CON.user):"";
    const pg=await api("GET","/api/logs?src="+CON.src+uq+"&after="+CON.after+"&limit=1000");
    if(pg.epoch!==CON.epoch){ CON.epoch=pg.epoch; CON.lines=[]; CON.after=0; if(pg.last>0&&pg.lines.length===0){ const full=await api("GET","/api/logs?src="+CON.src+uq+"&after=0&limit=1000"); pg.lines=full.lines; } }
    if(pg.lines.length){ CON.lines=CON.lines.concat(pg.lines).slice(-3000); }
    CON.after=pg.last; drawCon();
  }catch(e){ const el=$("#con"); if(el&&!CON.lines.length) el.textContent="Не удалось получить логи: "+e.message; }
  finally{ pollCon.busy=false; }
}


VIEWS.server=vServer; VIEWS.clients=vClients; VIEWS.console=vConsole; VIEWS.backup=vBackup; VIEWS.wg=vWG;

function start(){ readHash(); $("#login").classList.add("hidden"); $("#app").classList.remove("hidden"); load(); clearInterval(start.t); start.t=setInterval(()=>{ const a=document.activeElement; if(a&&["INPUT","TEXTAREA","SELECT"].includes(a.tagName)) return; if(TAB==="overview"||TAB==="nodes") load(); },15000);
  clearInterval(start.s); start.s=setInterval(()=>{ const a=document.activeElement; if(a&&["INPUT","TEXTAREA","SELECT"].includes(a.tagName)) return; if(TAB==="server"||TAB==="clients") load(); },5000);
  clearInterval(start.c); start.c=setInterval(pollCon,2000); }
if (TOKEN) { api("GET","/api/overview").then(start).catch(()=>logout(false)); } else { logout(false); }
</script>
