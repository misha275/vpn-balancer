# Копия этого файла -> config.yaml. Значения в <...> заполните.
database_url: postgres://balancer:${DB_PASSWORD}@postgres:5432/balancer   # подставьте пароль (или задайте env DATABASE_URL)

subscriptions:
  - https://example.com/sub/aaa
  - https://example.com/sub/bbb

sub_refresh: 30m
node_grace: 48h            # узел остаётся в пуле столько после исчезновения из подписки

# --- то, что видит пользователь (единый адрес шлюза) ---
domain: nvrk.ytc-srv.org   # основной домен: ссылки, подписки, сайт и WireGuard строятся на нём (IP не используются); запись A должна указывать на сервер
# public_host: устарело, заменяется domain
inbound_port: 443
reality:
  # sing-box generate reality-keypair  ->  private_key / public_key
  private_key: <PRIVATE_KEY>
  public_key: <PUBLIC_KEY>
  short_id: <openssl rand -hex 8>
  handshake_server: www.microsoft.com
  handshake_port: 443
  # Отпечаток TLS (рукопожатие) в выдаваемых ссылках. По умолчанию "firefox".
  # Если какой-то клиент (v2rayNG, Hiddify) перестал подключаться, а в логе шлюза "REALITY: processed invalid connection",
  # верните "ios": у новых клиентов Xray chrome/firefox шлют постквантовое приветствие, которое sing-box 1.11 может не распознать.
  fingerprint: firefox

# --- проверки ---
tier1_interval: 1m         # TCP-доступность
tier2_interval: 3m         # реальные HTTPS-запросы через узел
tier3_interval: 10m        # как часто искать узлы, которым пора измерить скорость
tier3_top: 5               # сколько узлов за один проход (свежий замер не повторяется: у провайдеров бывает лимит трафика)
speed_ttl: 12h             # через сколько часов замер скорости считается устаревшим
service_interval: 1h       # как часто проверять сервисы (Telegram, YouTube, X ...) через все узлы; текущий узел - каждые 10 минут
min_speed_kbps: 8000       # медленнее 8 Мбит/с узел не выбирается, пока есть быстрые (0 - не учитывать)
required_services: [telegram]   # узел, через который это не открывается, не выбирается, пока есть другие
# services: [...]          # список сервисов «имя = адрес, адрес»; по умолчанию Telegram, YouTube, X, TikTok, Instagram, Facebook, WhatsApp, Discord, Google, GitHub, OpenAI, Spotify, Netflix
watch_interval: 5s         # быстрая проверка текущего узла
switch_margin: 1.15        # новый узел должен быть лучше на 15%...
switch_confirm: 3          # ...в течение 3 циклов tier2 подряд
probe_urls:
  - https://www.gstatic.com/generate_204
  - https://cp.cloudflare.com/generate_204
  - https://www.youtube.com/generate_204
  # добавьте сайты, которые важны вашим пользователям

# --- страна выхода: куда узел выпускает трафик на самом деле ---
exit_check: true           # измерять страну выхода каждого узла; узлы с запрещённым/неизвестным выходом не используются
# blocked_exit_countries: [RU, UA, BY, CN, IR, SY, KP, TM, CU, MM]   # по умолчанию именно эти
# geo_urls: [https://ipinfo.io/json, https://api.country.is, https://ifconfig.co/json]
# geo_ttl: 6h
# geo_blocked_ttl: 30m     # как скоро перемерить узел, у которого выход оказался в запрещённой стране
# node_identity: endpoint  # link = каждая ссылка подписки отдельным узлом (даже с одинаковыми параметрами)

# --- правила для трафика пользователей (сверху вниз, срабатывает первое подошедшее) ---
# По умолчанию всё идёт через балансировщик. Напрямую с самого сервера: только то, что вы явно разрешили.
# Сервер находится в России, поэтому российские сайты удобно открывать напрямую через него:
rules:
  - action: direct         # direct | block | proxy
    match: ["*.ru", "*.su", "*.xn--p1ai"]    # зоны .ru, .su, .рф
#  - action: block
#    match: ["port:25", "100.200.255.0/24"]
default_action: proxy      # proxy | block (режим белого списка)

# --- подписка для пользователей: первый сервер балансировщик, дальше проверенные узлы ---
gateway: external          # шлюз в отдельном контейнере (docker-compose.yml): обновление контроллера не обрывает соединения
gateway_url: http://gateway:9000
# drain_timeout: 15m       # сколько открытые соединения могут доживать на старой конфигурации
# drain_urgent: 5s         # то же, если изменение что-то отзывает (пользователь, блокировка)
gateway_name: Балансировщик
# sub_listen: 0.0.0.0:8081                      # раскомментируйте, чтобы включить; порт откройте в docker-compose.yml
# sub_public_url: https://vpn.example.com:8081  # как этот адрес виден снаружи
# sub_tls_cert: /etc/balancer/certs/fullchain.pem  # HTTPS настоятельно рекомендуется
# sub_tls_key: /etc/balancer/certs/privkey.pem

telegram_token: ""
telegram_chat: ""

http_listen: 0.0.0.0:8080  # внутри контейнера; наружу проброшен только на 127.0.0.1

# WireGuard для домашнего роутера (MikroTik и т.п.): отдельная подсеть идёт через балансировщик с теми же фильтрами и политикой стран.
# Пиры создаются во вкладке «WireGuard» или командой vpnb wg add. Порт нужно открыть по UDP.
# wg_port: 51820
# wg_network: 10.77.0.0/24        # адреса внутри туннеля
# wg_endpoint: ""                 # IP/домен домашнего сервера, который увидит роутер (можно указать при выдаче скрипта)

# Сайт для пользователей (регистрация, кабинет, оплата-заглушка). Обычно всё включается в панели, вкладка «Сайт»;
# здесь только то, что в панели не меняется, и начальные значения.
# site_enabled: false
# site_domain: vpn.example.com      # A-запись должна указывать на сервер; сертификат Let's Encrypt выпускается автоматически
# site_email: admin@example.com
# site_payment: manual              # manual | stub_auto (тест, бесплатное продление!) | off
# site_trial_days: 3
# site_http_listen: ":80"           # проверка домена и переход на https
# site_https_listen: ":8443"        # 443 занят шлюзом
# site_via_reality: false           # сайт и на обычном 443 (браузеры -> сайт, клиенты с ключом -> VPN)

# Подписки по умолчанию и срок для созданных в панели пользователей (можно менять в панели, вкладка «Подписки»).
# Ключи: balancers, all, b:<адрес сборки своих узлов>. У тарифа и у пользователя может быть свой список.
# user_default_subs: [balancers]   # по умолчанию только 3 балансировщика; ещё: all, b:<категория>
# user_default_days: 0
